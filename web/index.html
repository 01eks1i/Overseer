<div id="root"></div>

<style>
.apisift-account{position:relative}
.apisift-account>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 4px;border-radius:8px;cursor:pointer;font-size:14px;color:rgb(var(--ink));user-select:none}
.apisift-account>summary::-webkit-details-marker{display:none}
.apisift-account>summary:hover,.apisift-account[open]>summary{background:rgb(var(--raised))}
.apisift-account>summary:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
.apisift-avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgb(var(--accent));color:rgb(var(--on-accent));font-weight:700;font-size:13px}
.apisift-account-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;display:grid;padding:6px;border-radius:12px;background:rgb(var(--surface));border:1px solid rgb(var(--ink)/0.12);box-shadow:0 12px 32px rgb(1 25 76/0.18);z-index:60}
.apisift-account-menu>*{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;color:rgb(var(--ink));text-decoration:none}
.apisift-account-menu>a:hover,.apisift-account-menu>a:focus-visible{background:rgb(var(--raised));outline:none}
.apisift-account-menu>[aria-disabled=true]{color:rgb(var(--faint));cursor:not-allowed}
.apisift-account-menu small{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:999px;background:rgb(var(--raised))}
@media (max-width:639px){.apisift-account-label{display:none}.apisift-account>summary{padding:0 4px}}
.apisift-logo{display:inline-flex;align-items:center}
.apisift-logo img{height:28px;width:auto;display:block}
.apisift-logo .apisift-logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .apisift-logo .apisift-logo-light{display:none}:root:not([data-theme=light]) .apisift-logo .apisift-logo-dark{display:block}}
:root[data-theme=dark] .apisift-logo .apisift-logo-light{display:none}
:root[data-theme=dark] .apisift-logo .apisift-logo-dark{display:block}
</style>
<script>
// Close the account menu on outside click or Escape (a <details> element stays open otherwise).
document.addEventListener("click",function(e){document.querySelectorAll(".apisift-account[open]").forEach(function(d){if(!d.contains(e.target))d.removeAttribute("open")})});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.querySelectorAll(".apisift-account[open]").forEach(function(d){d.removeAttribute("open")})});
</script>
